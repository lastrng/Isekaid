name: Content quality

on:
  pull_request:
    paths:
      - "src/**/*.json"
      - "scripts/audit-content.mjs"
      - "scripts/content-pack-*.mjs"
  push:
    branches: ["main"]
    paths:
      - "src/**/*.json"
      - "scripts/audit-content.mjs"
      - "scripts/content-pack-*.mjs"
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit editorial data
        run: npm run content:audit
